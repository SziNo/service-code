name: PR checks

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Run tests
        run: uv run python -m unittest -v

      - name: Build image (no push)
        run: docker build -t hello-pr-check .
